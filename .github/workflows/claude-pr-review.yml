name: Claude PR Review

# 不含 synchronize：与交互式 Claude Code 共享订阅额度，收紧触发次数
# pull_request_target：fork/dependabot PR 默认拿不到 secrets；不检出/执行 PR 改动内容，只读 diff 文本

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "要 review 的 PR 号（用于手动测试，不受作者/draft/label 限制）"
        required: true
        type: string

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login != 'windybirth' &&
       !contains(toJSON(github.event.pull_request.labels), '"name":"release"') &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NUMBER="${{ inputs.pr_number }}"
          else
            NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            先读取仓库里的 .claude/skills/pr-review-checklist/SKILL.md 文件内容，按照其中的判断标准和输出规范 review 这个 PR。
            用 `gh pr diff ${{ steps.pr.outputs.number }}` 查看改动，用 `gh pr view ${{ steps.pr.outputs.number }}` 查看 PR 描述作为背景。
            最后用 `gh pr comment ${{ steps.pr.outputs.number }} --body "..."` 发布一条顶层综述评论。
            不要提交 APPROVE/REQUEST_CHANGES 等正式 review 状态，不要发 inline 行内评论。
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
