name: Claude PR Review

# 不含 synchronize：CLAUDE_CODE_OAUTH_TOKEN 与交互式 Claude Code 共享订阅额度，收紧触发次数
# 用 pull_request_target 而非 pull_request：外部贡献者的 PR 大多来自 fork，
# fork 触发的 pull_request 默认拿不到仓库 secrets（含 CLAUDE_CODE_OAUTH_TOKEN）。

on:
  pull_request_target:
    types: [opened, ready_for_review]
  workflow_dispatch: {}

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login != 'windybirth' &&
       github.event.pull_request.user.type != 'Bot' &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      # 不传 ref：pull_request_target 默认检出 base 分支而非 PR 改动本身，刻意如此——
      # 不执行/编译贡献者提交的代码，diff 内容全程只用 gh pr diff 以文本形式读取。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
            if [ -z "$NUMBER" ]; then
              echo "No open PR found for branch ${{ github.ref_name }}" >&2
              exit 1
            fi
          else
            NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            先读取仓库里的 .claude/skills/pr-review-checklist/SKILL.md 文件内容，按照其中的判断标准和输出规范 review 这个 PR。
            用 `gh pr diff ${{ steps.pr.outputs.number }}` 查看改动，用 `gh pr view ${{ steps.pr.outputs.number }}` 查看 PR 描述作为背景。
            最后用 `gh pr comment ${{ steps.pr.outputs.number }} --body "..."` 发布一条中文顶层综述评论。
            不要提交 APPROVE/REQUEST_CHANGES 等正式 review 状态，不要发 inline 行内评论。
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
