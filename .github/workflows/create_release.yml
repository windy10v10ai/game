name: Create Release
on:
  push:
    branches:
      - main

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full history for tags

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release PR title is the version (see create_release_pr.yml)
          title=$(gh pr list --state merged --base main --search ${{ github.sha }} \
            --json title -q '.[0].title')

          if ! echo "$title" | grep -Eq '^v[0-9]+\.[0-9]{2}$'; then
            echo "Merged PR title '$title' is not a version, skip release."
            exit 0
          fi

          # Tag the develop side of the merge commit: main-only release merge
          # commits would otherwise show up as noise in the generated notes.
          target=$(git rev-parse --verify -q ${{ github.sha }}^2 || echo ${{ github.sha }})
          previous=$(git tag -l 'v*.*' | sort -V | tail -n 1)

          gh release create "$title" --target "$target" --title "$title" \
            --generate-notes ${previous:+--notes-start-tag "$previous"}
