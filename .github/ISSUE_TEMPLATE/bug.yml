name: BUG 报告 / Bug report
description: 游戏里出了问题 / Something in the game is not working
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索[已有的 Issue](https://github.com/windy10v10ai/game/issues)，避免重复。标题写清现象，例如「某英雄的 X 技能不触发」。
        请不要在这里贴密钥、Token 或个人信息。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 实际看到的现象 / What you actually saw
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的表现 / What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从进入游戏到出问题的最短步骤；必现还是偶发 / The shortest steps; always or sometimes
      placeholder: |
        1. 选择英雄……
        2. 购买物品……
        3. ……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 游戏版本 / Game version
      description: 创意工坊页面或游戏内显示的版本号 / Version shown on the Workshop page or in game
      placeholder: v5.00a
  - type: input
    id: context
    attributes:
      label: 英雄、难度、模式 / Hero, difficulty, mode
      description: 可选 / Optional
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或日志 / Screenshots, recordings or logs
      description: 可以直接拖拽到这里 / Drag files in here
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 我搜索过已有的 Issue，没有重复 / I searched existing issues and found no duplicate
          required: true
