<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1400" height="640" fill="#fcfcfb"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start">近战威压：改了什么</text>
<text x="40" y="100" font-size="24" font-weight="700" fill="#eb6834" text-anchor="start">修改前</text>
<rect x="40" y="120" width="200" height="110" rx="12" fill="#f1efe8" stroke="#898781" stroke-width="3"/>
<text x="140.0" y="171.0" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">近战英雄</text>
<text x="140.0" y="201.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">出生时挂上</text>
<line x1="240" y1="175" x2="310" y2="175" stroke="#898781" stroke-width="4"/>
<polygon points="310,175 296,166 296,184" fill="#898781"/>
<rect x="310" y="120" width="520" height="110" rx="12" fill="#faece7" stroke="#eb6834" stroke-width="3"/>
<text x="570.0" y="171.0" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">一段 Lua 脚本</text>
<text x="570.0" y="201.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">状态抗性 +15%（引擎每次查询都要运行脚本）</text>
<rect x="870" y="120" width="490" height="110" rx="12" fill="#f1efe8" stroke="#898781" stroke-width="3"/>
<text x="1115.0" y="171.0" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">配置里的「威压」效果</text>
<text x="1115.0" y="201.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">魔法抗性 +20%，显示威压图标</text>
<line x1="270" y1="175" x2="270" y2="255" stroke="#898781" stroke-width="4"/>
<line x1="270" y1="255" x2="1115" y2="255" stroke="#898781" stroke-width="4"/>
<line x1="1115" y1="255" x2="1115" y2="232" stroke="#898781" stroke-width="4"/>
<polygon points="1115,232 1106,246 1124,246" fill="#898781"/>
<text x="40" y="322" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="start">修改后</text>
<rect x="40" y="350" width="200" height="200" rx="12" fill="#f1efe8" stroke="#898781" stroke-width="3"/>
<text x="140.0" y="446.0" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">近战英雄</text>
<text x="140.0" y="476.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">出生时挂上</text>
<line x1="240" y1="450" x2="310" y2="450" stroke="#898781" stroke-width="4"/>
<polygon points="310,450 296,441 296,459" fill="#898781"/>
<rect x="310" y="335" width="1050" height="235" rx="14" fill="#fafaf9" stroke="#2a78d6" stroke-width="3"/>
<text x="335" y="367" font-size="20" font-weight="700" fill="#2a78d6" text-anchor="start">新增隐藏技能「威压」（玩家看不到，只用来放数值）</text>
<rect x="340" y="390" width="420" height="150" rx="12" fill="#e6f1fb" stroke="#2a78d6" stroke-width="3"/>
<text x="550.0" y="461.0" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">魔法抗性 +20%</text>
<text x="550.0" y="491.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">显示威压图标（和以前一样）</text>
<text x="795" y="476" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">＋</text>
<rect x="830" y="390" width="500" height="150" rx="12" fill="#eaf3de" stroke="#3b6d11" stroke-width="3"/>
<text x="1080.0" y="461.0" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">游戏自带的「泰坦强化」</text>
<text x="1080.0" y="491.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">读取技能里的数值 → 状态抗性 +15%</text>
<text x="40" y="612" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">没有 Lua 脚本了：状态抗性交给游戏自带效果，引擎原生计算，不再逐次运行脚本。</text>
</svg>