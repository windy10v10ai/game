<text class="st" x="16" y="1001.0">AI 审查</text>
<text class="ss" x="16" y="1025.0">review-pr</text>
<text class="ss" x="16" y="1043.0">auto</text>
<line class="grid" x1="0" y1="1088" x2="1130" y2="1088"/>
<text class="st" x="16" y="1140.0">人工审查</text>
<text class="ss" x="16" y="1164.0">review-pr</text>
