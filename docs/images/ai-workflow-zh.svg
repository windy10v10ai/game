<text class="st" x="16" y="1117">上线</text>
<text class="ss" x="16" y="1135">release-note</text>
<text class="ss" x="16" y="1150">deploy</text>
<rect class="nh" x="177.5" y="54" width="320" height="58" rx="8"/>
<text class="t" x="189.5" y="79">提需求，定优先级</text>
<text class="d" x="189.5" y="99">issue-triage 查重复、建议优先级</text>
<rect class="na" x="552.5" y="140" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="165">起草设计与执行说明</text>
<text class="d" x="564.5" y="185">在 artifact 里讨论；</text>
<text class="d" x="564.5" y="203">执行说明写明用哪个 skill</text>
<rect class="nh" x="177.5" y="244" width="320" height="58" rx="8"/>
<text class="t" x="189.5" y="269">拍板</text>
<text class="d" x="189.5" y="289">设计挂到 issue，打 agent-todo</text>
<rect class="nh" x="177.5" y="330" width="320" height="76" rx="8"/>
<text class="t" x="189.5" y="355">开工</text>
<text class="d" x="189.5" y="375">/issue-impl 123：现在做一条</text>
<text class="d" x="189.5" y="393">/issue-autorun：依次做完所有 agent-todo</text>
<rect class="na" x="552.5" y="434" width="320" height="220" rx="8"/>
<text class="t" x="564.5" y="459">按指定 skill 实现</text>
<text x="564.5" y="479"><tspan class="code">custom-ability</tspan><tspan class="d" x="702.5">从零自制技能</tspan></text>
<text x="564.5" y="497"><tspan class="code">clone-ability</tspan><tspan class="d" x="702.5">克隆原版技能做差分</tspan></text>
<text x="564.5" y="515"><tspan class="code">awaken-ability</tspan><tspan class="d" x="702.5">英雄觉醒技能</tspan></text>
<text x="564.5" y="533"><tspan class="code">custom-item</tspan><tspan class="d" x="702.5">自制物品、合成神器</tspan></text>
<text x="564.5" y="551"><tspan class="code">clone-item</tspan><tspan class="d" x="702.5">原版物品升级版</tspan></text>
<text x="564.5" y="569"><tspan class="code">add-image</tspan><tspan class="d" x="702.5">图标与 UI 图片</tspan></text>
<text x="564.5" y="587"><tspan class="code">bot-ability-usage</tspan><tspan class="d" x="702.5">bot 何时施法</tspan></text>
<text x="564.5" y="605"><tspan class="code">bot-item-usage</tspan><tspan class="d" x="702.5">bot 何时用物品</tspan></text>
<text x="564.5" y="623"><tspan class="code">bot-ai-tuning</tspan><tspan class="d" x="702.5">bot 决策与移动</tspan></text>
<text x="564.5" y="641"><tspan class="code">bot-skill-build</tspan><tspan class="d" x="702.5">bot 技能加点与天赋</tspan></text>
<rect class="na" x="552.5" y="682" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="707">测试与实机</text>
<text class="d" x="564.5" y="727">jest、lint、构建；</text>
<text class="d" x="564.5" y="745">dota-live-test 脚本判定与截图</text>
<rect class="na" x="552.5" y="786" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="811">开 PR</text>
<text class="d" x="564.5" y="831">create-pr：正文写关键信息，</text>
<text class="d" x="564.5" y="849">日志放一条评论</text>
<rect class="na" x="552.5" y="890" width="320" height="94" rx="8"/>
<text class="t" x="564.5" y="915">审核 PR</text>
<text class="d" x="564.5" y="935">代码、证据与截图。</text>
<text class="d" x="564.5" y="953">不过就退回实现者重改，</text>
<text class="d" x="564.5" y="971">PR 只留最终结果</text>
<rect class="nh" x="177.5" y="1012" width="320" height="58" rx="8"/>
<text class="t" x="189.5" y="1037">审阅与亲测</text>
<text class="d" x="189.5" y="1057">逐条拍板，进游戏亲测手感</text>
<rect class="nh" x="177.5" y="1098" width="320" height="58" rx="8"/>
<text class="t" x="189.5" y="1123">合并与发布</text>
<text class="d" x="189.5" y="1143">更新日志、创意工坊</text>
