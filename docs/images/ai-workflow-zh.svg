<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 1306" width="1130" height="1306" role="img">
<style>
  .bg{fill:#ffffff} .stagebg{fill:#f5f7f8}
  .hh{fill:#e9edfb} .ha{fill:#e2f4ee}
  .grid{stroke:#d5dce1;stroke-width:1} .dash{stroke:#d5dce1;stroke-dasharray:4 4}
  .nh{fill:#e9edfb;stroke:#b7c3f0;stroke-width:1.5} .na{fill:#e2f4ee;stroke:#a6dcc9;stroke-width:1.5}
  .t{font:600 19px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#1a2126}
  .d{font:16.5px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#5b6770}
  .code{font:15.5px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#0b7d61}
  .st{font:600 19px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#1a2126}
  .ss{font:14.5px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#5b6770}
  .hd{font:700 15px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;letter-spacing:.06em}
  .hdS{fill:#5b6770} .hdH{fill:#3451c6} .hdA{fill:#0b7d61}
  .wire{fill:none;stroke:#8a98a2;stroke-width:2} .ah{fill:#8a98a2}
  .loop{fill:none;stroke:#b26a00;stroke-width:2;stroke-dasharray:6 5} .lh{fill:#b26a00}
  .lt{font:600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#b26a00}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161d22} .stagebg{fill:#0f1418}
    .hh{fill:#1c2445} .ha{fill:#12302a}
    .grid,.dash{stroke:#2a343b}
    .nh{fill:#1c2445;stroke:#34428a} .na{fill:#12302a;stroke:#1f5a4b}
    .t,.st{fill:#e2e8ec} .d,.ss,.hdS{fill:#94a2ab}
    .code{fill:#5fd3ad} .hdH{fill:#9fb2ff} .hdA{fill:#5fd3ad}
    .wire{stroke:#6b7a84} .ah{fill:#6b7a84}
    .loop{stroke:#f0b35a} .lh,.lt{fill:#f0b35a}
  }
</style>
