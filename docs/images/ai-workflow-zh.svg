<text class="d" x="673" y="894">create-pr：正文只放关键信息，</text>
<text class="d" x="673" y="916">日志放进一条评论</text>
<rect class="na" x="657" y="960" width="420" height="114" rx="9"/>
<text class="t" x="673" y="988">验证 PR</text>
<text class="d" x="673" y="1014">代码、证据与截图。</text>
<text class="d" x="673" y="1036">有问题退回实现者；</text>
<text class="d" x="673" y="1058">PR 只保留最终结果</text>
<rect class="nh" x="192" y="1102" width="420" height="92" rx="9"/>
<text class="t" x="208" y="1130">审查与试玩</text>
<text class="d" x="208" y="1156">拍板待处理项，</text>
<text class="d" x="208" y="1178">在游戏里判断手感</text>
<rect class="nh" x="192" y="1222" width="420" height="70" rx="9"/>
<text class="t" x="208" y="1250">合并与发布</text>
<text class="d" x="208" y="1276">更新日志、创意工坊</text>
