<text class="t" x="673" y="202">起草设计与执行说明</text>
<text class="d" x="673" y="228">设计在 artifact 里讨论；</text>
<text class="d" x="673" y="250">执行说明写明用哪个 skill</text>
<rect class="nh" x="192" y="294" width="420" height="92" rx="9"/>
<text class="t" x="208" y="322">拍板</text>
<text class="d" x="208" y="348">设计挂到 issue，</text>
<text class="d" x="208" y="370">打上 agent-todo</text>
<rect class="nh" x="192" y="414" width="420" height="136" rx="9"/>
<text class="t" x="208" y="442">开工</text>
<text class="d" x="208" y="468">/issue-impl 123：在当前对话里</text>
<text class="d" x="208" y="490">直接做一条 issue</text>
<text class="d" x="208" y="512">/issue-autorun：你不在时，</text>
<text class="d" x="208" y="534">依次做完所有 agent-todo</text>
<rect class="na" x="657" y="578" width="420" height="114" rx="9"/>
<text class="t" x="673" y="606">按指定 skill 实现</text>
<text class="code" x="673" y="632">custom-ability · clone-ability</text>
