<text class="st" x="16" y="1241.0">发布</text>
<text class="ss" x="16" y="1265.0">release-note</text>
<text class="ss" x="16" y="1283.0">deploy</text>
<rect class="nh" x="192" y="54" width="420" height="92" rx="9"/>
<text class="t" x="208" y="82">提需求、定优先级</text>
<text class="d" x="208" y="108">issue-triage 查重复与过期，</text>
<text class="d" x="208" y="130">建议优先级</text>
