<text class="t" x="564.5" y="441">按指定 skill 实现</text>
<text x="564.5" y="461"><tspan class="code">custom-ability</tspan><tspan class="d" x="702.5">从零自制技能</tspan></text>
<text x="564.5" y="479"><tspan class="code">clone-ability</tspan><tspan class="d" x="702.5">克隆原版技能做差分</tspan></text>
<text x="564.5" y="497"><tspan class="code">awaken-ability</tspan><tspan class="d" x="702.5">英雄觉醒技能</tspan></text>
<text x="564.5" y="515"><tspan class="code">custom-item</tspan><tspan class="d" x="702.5">自制物品、合成神器</tspan></text>
<text x="564.5" y="533"><tspan class="code">clone-item</tspan><tspan class="d" x="702.5">原版物品升级版</tspan></text>
<text x="564.5" y="551"><tspan class="code">add-image</tspan><tspan class="d" x="702.5">图标与 UI 图片</tspan></text>
<text x="564.5" y="569"><tspan class="code">bot-ability-usage</tspan><tspan class="d" x="702.5">bot 何时施法</tspan></text>
<text x="564.5" y="587"><tspan class="code">bot-item-usage</tspan><tspan class="d" x="702.5">bot 何时用物品</tspan></text>
<text x="564.5" y="605"><tspan class="code">bot-ai-tuning</tspan><tspan class="d" x="702.5">bot 决策与移动</tspan></text>
<text x="564.5" y="623"><tspan class="code">bot-skill-build</tspan><tspan class="d" x="702.5">bot 技能加点与天赋</tspan></text>
<rect class="na" x="552.5" y="664" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="689">测试与实机</text>
<text class="d" x="564.5" y="709">jest、lint、构建；</text>
<text class="d" x="564.5" y="727">dota-live-test 脚本判定与截图</text>
<rect class="na" x="552.5" y="768" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="793">开 PR</text>
<text class="d" x="564.5" y="813">create-pr：正文写关键信息，</text>
<text class="d" x="564.5" y="831">日志放一条评论</text>
<rect class="na" x="552.5" y="872" width="320" height="94" rx="8"/>
<text class="t" x="564.5" y="897">审核 PR</text>
<text class="d" x="564.5" y="917">代码、证据与截图。</text>
<text class="d" x="564.5" y="935">不过由调度员退回重改，</text>
<text class="d" x="564.5" y="953">PR 只留最终结果</text>
<rect class="nh" x="177.5" y="994" width="320" height="58" rx="8"/>
<text class="t" x="189.5" y="1019">审阅与亲测</text>
<text class="d" x="189.5" y="1039">逐条拍板，进游戏亲测手感</text>
<rect class="nh" x="177.5" y="1080" width="320" height="58" rx="8"/>
<text class="t" x="189.5" y="1105">合并与发布</text>
<text class="d" x="189.5" y="1125">更新日志、创意工坊</text>
