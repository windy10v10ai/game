<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1224" width="900" height="1224" role="img">

<style>
  .bg{fill:#ffffff} .stagebg{fill:#f5f7f8} .awaybg{fill:#eceff2}
  .hh{fill:#e9edfb} .ha{fill:#e2f4ee}
  .grid{stroke:#d5dce1;stroke-width:1} .dash{stroke:#d5dce1;stroke-dasharray:4 4}
  .nh{fill:#e9edfb;stroke:#b7c3f0;stroke-width:1.5} .na{fill:#e2f4ee;stroke:#a6dcc9;stroke-width:1.5}
  .t{font:600 14px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#1a2126}
  .d{font:12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#5b6770}
  .code{font:12px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#0b7d61}
  .st{font:600 14px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#1a2126}
  .ss{font:11.5px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#5b6770}
  .hd{font:700 12px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;letter-spacing:.06em}
  .hdS{fill:#5b6770} .hdH{fill:#3451c6} .hdA{fill:#0b7d61}
  .aw{font:11px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#5b6770;letter-spacing:.06em}
  .wire{fill:none;stroke:#8a98a2;stroke-width:1.6} .ah{fill:#8a98a2}
  .loop{fill:none;stroke:#b26a00;stroke-width:1.6;stroke-dasharray:5 4} .lh{fill:#b26a00}
  .lt{font:11.5px 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;fill:#b26a00}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161d22} .stagebg{fill:#0f1418} .awaybg{fill:#1a2227}
    .hh{fill:#1c2445} .ha{fill:#12302a}
    .grid,.dash{stroke:#2a343b}
    .nh{fill:#1c2445;stroke:#34428a} .na{fill:#12302a;stroke:#1f5a4b}
    .t,.st{fill:#e2e8ec} .d,.ss,.aw,.hdS{fill:#94a2ab}
    .code{fill:#5fd3ad} .hdH{fill:#9fb2ff} .hdA{fill:#5fd3ad}
    .wire{stroke:#6b7a84} .ah{fill:#6b7a84}
    .loop{stroke:#f0b35a} .lh,.lt{fill:#f0b35a}
  }
</style>
<rect class="bg" x="0" y="0" width="900" height="1224" rx="10"/>
<rect class="stagebg" x="0" y="0" width="150" height="1224"/>
<rect class="stagebg" x="0" y="0" width="150" height="40"/>
<rect class="hh" x="150" y="0" width="375" height="40"/>
<rect class="ha" x="525" y="0" width="375" height="40"/>
<text class="hd hdS" x="16" y="25">STAGE</text>
<text class="hd hdH" x="337.5" y="25" text-anchor="middle">HUMAN</text>
<text class="hd hdA" x="712.5" y="25" text-anchor="middle">AI</text>
<line class="grid" x1="0" y1="40" x2="900" y2="40"/>
<line class="dash" x1="525" y1="40" x2="525" y2="1224"/>
<line class="grid" x1="150" y1="0" x2="150" y2="1224"/>
<text class="st" x="16" y="89.0">Plan</text>
<text class="ss" x="16" y="107.0">issue-triage</text>
<line class="grid" x1="0" y1="144" x2="900" y2="144"/>
<text class="st" x="16" y="290.0">Design</text>
<text class="ss" x="16" y="308.0">brainstorming</text>
<text class="ss" x="16" y="323.0">issue-spec</text>
<line class="grid" x1="0" y1="456" x2="900" y2="456"/>
<text class="st" x="16" y="681.0">Build</text>
<text class="ss" x="16" y="699.0">issue-impl</text>
<line class="grid" x1="0" y1="912" x2="900" y2="912"/>
<text class="st" x="16" y="963.0">AI review</text>
<text class="ss" x="16" y="981.0">review-pr</text>
<text class="ss" x="16" y="996.0">auto</text>
<line class="grid" x1="0" y1="1034" x2="900" y2="1034"/>
<text class="st" x="16" y="1083.0">Human review</text>
<text class="ss" x="16" y="1101.0">review-pr</text>
<line class="grid" x1="0" y1="1138" x2="900" y2="1138"/>
<text class="st" x="16" y="1171.0">Ship</text>
<text class="ss" x="16" y="1189.0">release-note</text>
<text class="ss" x="16" y="1204.0">deploy</text>
<rect class="nh" x="177.5" y="54" width="320" height="76" rx="8"/>
<text class="t" x="189.5" y="79">Raise a need, set priority</text>
<text class="d" x="189.5" y="99">issue-triage finds duplicates</text>
<text class="d" x="189.5" y="117">and suggests priority</text>
<rect class="na" x="552.5" y="158" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="183">Draft the design and spec</text>
<text class="d" x="564.5" y="203">Discussed in an artifact;</text>
<text class="d" x="564.5" y="221">the spec names the skill to use</text>
<rect class="nh" x="177.5" y="262" width="320" height="76" rx="8"/>
<text class="t" x="189.5" y="287">Approve</text>
<text class="d" x="189.5" y="307">Design attached to the issue,</text>
<text class="d" x="189.5" y="325">labeled agent-todo</text>
<rect class="nh" x="177.5" y="366" width="320" height="76" rx="8"/>
<text class="t" x="189.5" y="391">Start</text>
<text class="d" x="189.5" y="411">/issue-impl 123: one issue now</text>
<text class="d" x="189.5" y="429">/issue-autorun: all agent-todo issues</text>
<rect class="na" x="552.5" y="470" width="320" height="220" rx="8"/>
<text class="t" x="564.5" y="495">Implement with the named skill</text>
<text x="564.5" y="515"><tspan class="code">custom-ability</tspan><tspan class="d" x="702.5">new ability in TypeScript</tspan></text>
<text x="564.5" y="533"><tspan class="code">clone-ability</tspan><tspan class="d" x="702.5">variant of a Dota ability</tspan></text>
<text x="564.5" y="551"><tspan class="code">awaken-ability</tspan><tspan class="d" x="702.5">hero awakening ability</tspan></text>
<text x="564.5" y="569"><tspan class="code">custom-item</tspan><tspan class="d" x="702.5">new item or artifact</tspan></text>
<text x="564.5" y="587"><tspan class="code">clone-item</tspan><tspan class="d" x="702.5">upgraded Dota item</tspan></text>
<text x="564.5" y="605"><tspan class="code">add-image</tspan><tspan class="d" x="702.5">icons and UI images</tspan></text>
<text x="564.5" y="623"><tspan class="code">bot-ability-usage</tspan><tspan class="d" x="702.5">when bots cast a spell</tspan></text>
<text x="564.5" y="641"><tspan class="code">bot-item-usage</tspan><tspan class="d" x="702.5">when bots use an item</tspan></text>
<text x="564.5" y="659"><tspan class="code">bot-ai-tuning</tspan><tspan class="d" x="702.5">bot decisions and movement</tspan></text>
<text x="564.5" y="677"><tspan class="code">bot-skill-build</tspan><tspan class="d" x="702.5">bot skill and talent order</tspan></text>
<rect class="na" x="552.5" y="718" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="743">Test and play-test</text>
<text class="d" x="564.5" y="763">jest, lint, build;</text>
<text class="d" x="564.5" y="781">dota-live-test checks and screenshots</text>
<rect class="na" x="552.5" y="822" width="320" height="76" rx="8"/>
<text class="t" x="564.5" y="847">Open the PR</text>
<text class="d" x="564.5" y="867">create-pr: key facts in the body,</text>
<text class="d" x="564.5" y="885">logs in one comment</text>
<rect class="na" x="552.5" y="926" width="320" height="94" rx="8"/>
<text class="t" x="564.5" y="951">Verify the PR</text>
<text class="d" x="564.5" y="971">Code, evidence and screenshots.</text>
<text class="d" x="564.5" y="989">Fixes go back to the implementer;</text>
<text class="d" x="564.5" y="1007">the PR keeps only the final result</text>
<rect class="nh" x="177.5" y="1048" width="320" height="76" rx="8"/>
<text class="t" x="189.5" y="1073">Review and play</text>
<text class="d" x="189.5" y="1093">Rule on open items,</text>
<text class="d" x="189.5" y="1111">judge the feel in game</text>
<rect class="nh" x="177.5" y="1152" width="320" height="58" rx="8"/>
<text class="t" x="189.5" y="1177">Merge and publish</text>
<text class="d" x="189.5" y="1197">Release note, Steam Workshop</text>
