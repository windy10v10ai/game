# Overlay for dsh-run.py --executor sonnet: route the agent to the logged-in Claude Code CLI
# through the dsh-oh-my-claude provider instead of DeepSeek.
- id: oh-my-claude
  name: dsh-oh-my-claude
  config:
    command: 'C:\Users\windy\AppData\Roaming\npm\node_modules\@anthropic-ai\claude-code\bin\claude.exe'
    permissionMode: bypassPermissions
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: claude-code
    model: claude-sonnet-5-5
